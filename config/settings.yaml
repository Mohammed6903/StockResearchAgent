# Vertex AI / Gemini
vertex:
  # Leave as placeholder to auto-resolve from $GOOGLE_CLOUD_PROJECT or your ADC quota
  # project; or set your project id explicitly here.
  project: your-gcp-project-id
  location: us-central1
  model: gemini-2.5-pro          # reasoning model for analysis/synthesis
  fast_model: gemini-2.5-flash   # cheaper model for macro scan / news triage

# Universe
universe:
  index: NIFTY50        # SP500 | NIFTY50 | NONE (index members unioned with watchlist)
  benchmark: ^NSEI      # benchmark used for beta/alpha (^NSEI = NIFTY 50, ^BSESN = SENSEX)
  max_tickers: 50       # safety cap on a full scan
  region: India         # focuses macro/news (India | US | global)

# Quant
quant:
  lookback_days: 365    # price history window for beta/alpha/sharpe/vol
  risk_free_rate: 0.065 # annual, for Sharpe (India 10Y G-Sec ~6.5%)

# Runtime
runtime:
  concurrency: 4        # parallel ticker workers
  cache_ttl_hours: 12   # data cache lifetime
  reports_dir: reports
  db_path: .cache/stockresearch.db
