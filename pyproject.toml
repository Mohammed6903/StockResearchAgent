[project]
name = "stockresearch"
version = "0.1.0"
description = "Agentic daily stock research system on Google ADK + Vertex AI Gemini"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "pymongo>=4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "freezegun>=1.4", "mongomock>=4.1"]

[project.scripts]
stockresearch = "stockresearch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockresearch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
